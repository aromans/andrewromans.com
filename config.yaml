    bio: "Security engineer and vulnerability researcher specializing in reverse engineering and malware analysis, with applied machine learning experience across both halves of the field. Three and a half years in offensive and defensive security, following five years of machine learning and software engineering. Most recently applied both in an M.S. capstone fine-tuning code LLMs to automate binary deobfuscation. Fluent in low-level systems - C, x86-64, ARM, and MIPS - and in the modern training stack, including PyTorch, HuggingFace, and PEFT. Competitive CTF player: solved every challenge in Flare-On 12 for a top 100 finish, and earned High Performer in the NSA Codebreaker Challenge in 2022 and 2025."
